name: Release

# The version in GearOrSkill.toc is the source of truth. A push to main releases that
# version if it has no release yet. The daily run refreshes Data.lua from wowsims and,
# only if it changed, raises the patch version, commits and releases.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh data from wowsims
        if: github.event_name != 'push'
        run: |
          git clone --quiet --depth 1 https://github.com/wowsims/forever "$RUNNER_TEMP/wowsims"
          python3 tools/build_data.py "$RUNNER_TEMP/wowsims"
      - name: Test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.1
          lua5.1 tests/run.lua
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release.sh
